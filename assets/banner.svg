<svg xmlns="http://www.w3.org/2000/svg" width="960" height="304" viewBox="0 0 960 304" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Engineering in progress</title>
  <desc id="desc">Valentino. Desarrollo web, sistemas y bases de datos. Un diagrama conecta interfaz, API y datos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="304" gradientUnits="userSpaceOnUse"><stop stop-color="#101C2A"/><stop offset="1" stop-color="#0A1018"/></linearGradient>
    <linearGradient id="accent" x1="56" y1="0" x2="904" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#85F3CC"/><stop offset="1" stop-color="#6BAAFF"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#7695B7" stroke-opacity=".065"/></pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
      .flow{stroke-dasharray:5 11;animation:flow 4s linear infinite}
      .signal{animation:signal 4s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-64}}
      @keyframes signal{0%,100%{opacity:.45}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.flow,.signal{animation:none}}
    </style>
  </defs>
  <rect x=".5" y=".5" width="959" height="303" rx="18" fill="url(#bg)" stroke="#27374B"/>
  <rect x="1" y="1" width="958" height="302" rx="18" fill="url(#grid)"/>
  <path d="M56 1H904" stroke="url(#accent)" stroke-width="2"/>
  <g class="mono" font-size="11" letter-spacing="1.8">
    <text x="56" y="40" fill="#85F3CC">VALEN-CBS / PERSONAL PORTFOLIO</text>
    <text x="904" y="40" text-anchor="end" fill="#91A5BD">01 — CONTINUOUS LEARNING</text>
  </g>
  <g class="sans" font-size="59" font-weight="700" letter-spacing="-2.2">
    <text x="52" y="120" fill="#F0F5FB">Engineering</text>
    <text x="52" y="184" fill="url(#accent)">in progress.</text>
  </g>
  <text class="sans" x="56" y="220" fill="#A9B9CC" font-size="16">Valentino · Desarrollo web, sistemas y datos.</text>
  <path d="M56 249H505" stroke="#27374B"/>
  <text class="mono" x="56" y="276" fill="#91A5BD" font-size="11" letter-spacing="1">IDEA → MODELO → CÓDIGO → ITERACIÓN</text>
  <g stroke="#31465F">
    <path d="M626 110H704V156H782"/>
    <path d="M704 156V218H846V156"/>
    <path d="M626 110H704V156H782" class="flow" stroke="#85F3CC"/>
    <path d="M704 156V218H846V156" class="flow" stroke="#6BAAFF"/>
  </g>
  <g class="mono" font-size="12" letter-spacing="1">
    <rect x="572" y="82" width="108" height="56" rx="10" fill="#142536" stroke="#46647C"/>
    <path d="M588 100H600M588 106H596" stroke="#85F3CC" stroke-width="2"/>
    <text x="617" y="114" fill="#E6EFF9">UI</text>
    <rect x="750" y="128" width="116" height="56" rx="10" fill="#142536" stroke="#46647C"/>
    <text x="777" y="161" fill="#E6EFF9">{ API }</text>
    <rect x="612" y="190" width="108" height="56" rx="10" fill="#142536" stroke="#46647C"/>
    <text x="638" y="223" fill="#E6EFF9">DATA</text>
  </g>
  <circle cx="704" cy="156" r="5" fill="#85F3CC" class="signal"/>
  <circle cx="846" cy="218" r="4" fill="#6BAAFF" class="signal"/>
  <path d="M884 74H900V90M572 254V266H588" stroke="#58728E"/>
</svg>
